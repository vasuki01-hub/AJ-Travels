    function dateKey(v){if(!v)return '';if(v.toDate)return localKey(v.toDate());const d=v instanceof Date?v:new Date(v);return isNaN(d)?'':localKey(d);}

    function renderDisabled(){appRoot.innerHTML=`<main class="pending-shell"><section class="pending-card"><div class="pending-icon">!</div><h1>Account access is disabled</h1><p>Ask an AJ Tours &amp; Travel administrator to review your employee account.</p><button class="button soft" data-action="logout">${icon('logout')} Sign out</button></section></main>`;}

    function renderPortal(){const modules=state.settings.modules||DEFAULT_SETTINGS.modules;const title=({dashboard:'Dashboard',enquiries:'Enquiries',bookings:'Bookings',reports:'Reports',settings:'Settings'})[state.view]||'Dashboard';const newType=state.view==='bookings'?'booking':'enquiry';appRoot.innerHTML=`<div class="portal"><button class="mobile-shade ${state.mobileOpen?'':'hidden'}" data-action="close-mobile" aria-label="Close menu"></button><aside class="sidebar ${state.mobileOpen?'open':''}"><div class="sidebar-brand">${svgLogo()}<div style="min-width:0"><strong>${h(state.settings.agencyName||'AJ Tours & Travel')}</strong><small>TRAVEL DESK</small></div><button class="icon-button sidebar-close" data-action="close-mobile" aria-label="Close">${icon('close')}</button></div><div class="side-label">WORKSPACE</div><nav class="side-nav">${modules.dashboard?navButton('dashboard','Dashboard'):''}${modules.enquiries?navButton('enquiries','Enquiries'):''}${modules.bookings?navButton('bookings','Bookings'):''}${modules.reports?navButton('reports','Reports'):''}</nav><div class="side-spacer"></div><div class="sidebar-tip"><strong>Every trip, in good hands.</strong><p>Keep the details together and the next step clear.</p></div>${navButton('settings','Settings')}<div class="user-box"><span class="avatar">${h(initials(state.profile?.displayName||state.user?.email))}</span><div class="user-copy"><strong>${h(state.profile?.displayName||state.user?.email||'Team member')}</strong><small>${state.profile?.role==='admin'?'Portal administrator':'Approved employee'}</small></div><button class="icon-button" data-action="logout" title="Sign out">${icon('logout')}</button></div></aside><main class="main-shell"><header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" data-action="toggle-mobile" aria-label="Open menu">${icon('menu')}</button><div><h1>${title}</h1><div class="topbar-date">AJ Tours &amp; Travel <span style="color:#b3bdc8">/</span> ${h(title)}</div></div></div><div class="topbar-right"><label class="period-control">${icon('calendar')}<select aria-label="Global data period" data-change="period"><option value="all" ${state.period==='all'?'selected':''}>All time</option><option value="week" ${state.period==='week'?'selected':''}>This week</option><option value="month" ${state.period==='month'?'selected':''}>This month</option><option value="year" ${state.period==='year'?'selected':''}>This year</option></select></label><button class="button primary" data-action="new-record" data-type="${newType}">${icon('plus')}${newType==='booking'?'New booking':'New enquiry'}</button></div></header><section class="main-content">${!navigator.onLine?'<div class="sync-banner">You are offline. The app shell may open, but Firebase sign-in and customer records require an internet connection.</div>':''}${state.syncError?`<div class="sync-banner">${h(state.syncError)}</div>`:''}${renderView()}</section><footer class="app-footer"><span>AJ Tours &amp; Travel · Employee workspace</span><span>${h(periodLabel())} · GBP and dates follow Settings</span></footer></main>${state.modal?renderModal():''}</div>`;}
    function renderView(){if(state.view==='dashboard')return renderDashboard();if(state.view==='enquiries'||state.view==='bookings')return renderRecordsView(state.view);if(state.view==='reports')return renderReports();return renderSettings();}
    function renderDashboard(){const rows=periodRecords();const enquiries=rows.filter(r=>r.recordType==='enquiry');const bookings=rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled');const active=bookings.filter(r=>r.status!=='completed');const totalQuoted=sum(bookings,'totalFareQuoted'),received=sum(bookings,'receivedPayment'),profit=sum(bookings,'profit'),due=Math.max(0,totalQuoted-received);const next=[...bookings].filter(r=>r.departureDate>=localKey(new Date())).sort((a,b)=>String(a.departureDate).localeCompare(String(b.departureDate))).slice(0,4);const six=lastSixMonths(bookings);return `<div class="page-stack"><section class="welcome"><div class="welcome-copy"><div class="welcome-kicker">YOUR TRAVEL DESK · ${h(new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}).format(new Date()).toUpperCase())}</div><h2>Good travel starts with <em>good details.</em></h2><p>See what is moving, what is due and where each journey stands.</p><div class="welcome-actions"><button class="button primary" data-action="new-record" data-type="enquiry">${icon('plus')}New enquiry</button><button class="button" data-action="nav" data-view="bookings">View bookings ${icon('arrow')}</button></div></div><div class="welcome-art" aria-hidden="true">✈</div></section><section class="stat-grid"><article class="stat-card"><span class="stat-icon">${icon('plane')}</span><div class="stat-title">Active bookings</div><strong class="stat-value">${active.length}</strong><span class="stat-hint">${bookings.length-active.length} completed trips excluded</span></article><article class="stat-card"><span class="stat-icon">${icon('enquiries')}</span><div class="stat-title">Open enquiries</div><strong class="stat-value">${enquiries.filter(r=>!['converted','lost'].includes(r.status)).length}</strong><span class="stat-hint">${enquiries.length} enquiries recorded</span></article><article class="stat-card"><span class="stat-icon">${icon('reports')}</span><div class="stat-title">Profit to date</div><strong class="stat-value">${money(profit)}</strong><span class="stat-hint">Across non-cancelled bookings</span></article><article class="stat-card"><span class="stat-icon">£</span><div class="stat-title">Payments due</div><strong class="stat-value">${money(due)}</strong><span class="stat-hint">${money(received)} received of ${money(totalQuoted)}</span></article></section><section class="dash-grid"><article class="surface panel"><div class="section-head"><div><span class="eyebrow">BUSINESS SNAPSHOT</span><h3 style="margin-top:5px">Bookings &amp; margin</h3><p>Six-month quoted value and profit.</p></div><button class="link-button" data-action="nav" data-view="reports">Full report ${icon('arrow')}</button></div><div class="chart-box">${chartSvg(six)}</div></article><article class="surface panel"><div class="section-head"><div><span class="eyebrow">UP NEXT</span><h3 style="margin-top:5px">Upcoming departures</h3><p>Journeys on the horizon.</p></div></div>${next.length?`<div class="departures-list">${next.map(r=>`<div class="departure"><span class="departure-date"><strong>${h(r.departureDate?new Date(`${r.departureDate}T12:00:00`).getDate():'—')}</strong><small>${h(formatDate(r.departureDate,{month:'short'}).toUpperCase())}</small></span><div class="departure-info"><strong>${h(r.destination||r.customerName)}</strong><small>${h(r.customerName)} · ${h(r.systemPnr||'PNR pending')}</small></div></div>`).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">✈</div><strong>Nothing taking off just yet</strong><p>Future departure dates appear here.</p></div>'}</article></section><article class="surface panel"><div class="section-head"><div><span class="eyebrow">RECENT ACTIVITY</span><h3 style="margin-top:5px">Latest enquiries and bookings</h3></div><button class="link-button" data-action="nav" data-view="enquiries">Open enquiries ${icon('arrow')}</button></div>${renderTable(rows.slice(0,7),{grouped:false,actions:false})}</article></div>`;}
    function sum(rows,key){return rows.reduce((n,r)=>n+(Number(r[key])||0),0)}
    function lastSixMonths(bookings){return Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));const id=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const set=bookings.filter(r=>String(r.bookingDate||'').startsWith(id));return {label:d.toLocaleDateString('en-GB',{month:'short'}),quoted:sum(set,'totalFareQuoted'),profit:sum(set,'profit')}})}
    function chartSvg(data){const W=640,H=200,L=42,R=12,T=14,B=30;const max=Math.max(1,...data.flatMap(x=>[x.quoted,x.profit]));const y=v=>H-B-(v/max)*(H-T-B);const slot=(W-L-R)/Math.max(1,data.length);const bars=data.map((d,i)=>{const x=L+i*slot+slot*.22,w=slot*.24;return `<rect x="${x}" y="${y(d.quoted)}" width="${w}" height="${H-B-y(d.quoted)}" rx="4" fill="#2681df" opacity=".87"/><rect x="${x+w+4}" y="${y(d.profit)}" width="${w}" height="${H-B-y(d.profit)}" rx="4" fill="#28b49d" opacity=".9"/><text x="${L+i*slot+slot/2}" y="${H-8}" text-anchor="middle" class="chart-label">${h(d.label)}</text>`}).join('');const grid=[0,.5,1].map(q=>`<line x1="${L}" y1="${T+q*(H-T-B)}" x2="${W-R}" y2="${T+q*(H-T-B)}" class="chart-gridline"/>`).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly bookings and profit chart">${grid}${bars}</svg>`;}
    function renderRecordsView(type){const rows=activeRecords(type);const noun=type==='enquiries'?'enquiry':'booking';return `<div class="page-stack"><div class="page-intro"><div><span class="eyebrow">${type==='enquiries'?'KEEP THE NEXT STEP CLEAR':'EVERY DETAIL IN ITS PLACE'}</span><p>${type==='enquiries'?'Capture a new travel request and keep follow-ups moving.':'Review passengers, payments, profit and travel dates.'}</p></div></div><section class="surface toolbar"><div class="record-count"><strong>${rows.length}</strong><span>${type} · ${h(periodLabel().toLowerCase())}</span></div><div class="toolbar-controls"><label class="search-box">${icon('search')}<input placeholder="Search name, PNR, contact…" value="${h(state.search)}" data-input="search"><button class="icon-button ${state.search?'':'hidden'}" data-action="clear-search" aria-label="Clear search">${icon('close')}</button></label><label class="select-control">${icon('filter')}<select data-change="status"><option value="all">All statuses</option>${STATUS[type==='enquiries'?'enquiry':'booking'].map(s=>`<option value="${s}" ${state.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></label><label class="select-control"><select data-change="sort"><option value="recent" ${state.sort==='recent'?'selected':''}>Most recent</option><option value="departure" ${state.sort==='departure'?'selected':''}>Departure date</option><option value="name" ${state.sort==='name'?'selected':''}>Customer name</option></select></label></div></section><section class="surface table-surface"><div class="table-scroll">${renderTable(rows,{grouped:true,actions:true})}</div></section><div class="table-footer"><span>${icon('check')} Showing ${h(periodLabel().toLowerCase())} records; exports use these filters.</span><div class="table-actions"><button class="button small soft" data-action="export-excel" data-scope="view">${icon('excel')}Excel</button><button class="button small primary" data-action="export-pdf" data-scope="view">${icon('file')}PDF</button></div></div></div>`;}
    function renderTable(rows,{grouped=true,actions=true}={}){if(!rows.length)return `<div class="empty-state"><div class="empty-icon">${icon('file')}</div><strong>No records to show</strong><p>Add a travel record or adjust the filters.</p></div>`;const sorted=[...rows].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));const groups=new Map();sorted.forEach(r=>{const k=grouped?(entryKey(r).slice(0,7)||'undated'):'filtered';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});const allPeriodBookings=periodRecords().filter(r=>r.recordType==='booking'&&r.status!=='cancelled');let serial=0;const monthRows=[...groups.entries()].sort(([a],[b])=>a==='undated'?1:b==='undated'?-1:b.localeCompare(a));return `<table class="record-table"><thead><tr><th>Sr. No.</th><th>Customer / PNR</th><th>Journey</th><th>Entry date</th><th>Departure</th><th>Total quoted</th><th>Received</th><th>Payment</th><th>Status</th>${actions?'<th>Actions</th>':''}</tr></thead><tbody>${monthRows.map(([key,items])=>{const label=key==='filtered'?'Filtered records':key==='undated'?'Entry date not recorded':new Date(Number(key.slice(0,4)),Number(key.slice(5,7))-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});const monthProfit=sum(allPeriodBookings.filter(r=>entryKey(r).slice(0,7)===key),'profit');return `${grouped?`<tr class="month-row"><th colspan="${actions?10:9}"><span class="month-head"><span class="month-name">${icon('calendar')} ${h(label)} <small>${items.length} ${items.length===1?'entry':'entries'}</small></span>${items.some(r=>r.recordType==='booking')?`<span class="month-profit">Month profit <b>${money(monthProfit)}</b></span>`:''}</span></th></tr>`:''}${items.map(r=>{serial++;const contact=r.systemPnr||r.contactNo||'No reference yet';const route=[r.origin,r.destination].filter(Boolean).join(' → ');return `<tr><td class="serial" data-label="Sr. No.">${serial}</td><td data-label="Customer / PNR"><div class="customer-cell"><strong>${h(r.customerName||'—')}</strong><small>${h(contact)}</small></div></td><td data-label="Journey"><div class="journey-cell"><strong>${h(r.destination||'Journey TBD')}</strong><small>${h(route||'Details to follow')}</small></div></td><td data-label="Entry date">${h(formatDate(r.createdAt))}</td><td data-label="Departure">${h(formatDate(r.departureDate))}</td><td data-label="Total quoted">${money(r.totalFareQuoted)}</td><td data-label="Received">${money(r.receivedPayment)}</td><td data-label="Payment"><span class="payment-pill payment-${h(r.paymentStatus||'pending')}">${r.recordType==='booking'?paymentLabel(r.paymentStatus):'—'}</span></td><td data-label="Status"><span class="status-pill ${statusClass(r.status)}">${h(statusLabel(r.status))}</span></td>${actions?`<td data-label="Actions"><div class="row-actions"><button class="icon-button" title="Edit" data-action="edit-record" data-type="${r.recordType==='enquiry'?'enquiry':'booking'}" data-id="${h(r.id)}">${icon('edit')}</button>${r.recordType==='enquiry'&&!['converted','lost'].includes(r.status)?`<button class="icon-button" title="Create booking" data-action="convert" data-id="${h(r.id)}">${icon('arrow')}</button>`:''}<button class="icon-button" title="Delete" data-action="delete-record" data-type="${r.recordType==='enquiry'?'enquiry':'booking'}" data-id="${h(r.id)}">${icon('trash')}</button></div></td>`:''}</tr>`}).join('')}`}).join('')}</tbody></table>`;}
    function renderReports(){const rows=reportRecords();const bookings=rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled');const total=sum(bookings,'totalFareQuoted'),received=sum(bookings,'receivedPayment'),profit=sum(bookings,'profit'),due=Math.max(0,total-received);const sources=new Map();bookings.forEach(r=>{const k=r.issuedFrom||'Not specified';sources.set(k,(sources.get(k)||0)+Number(r.totalFareQuoted||0))});const max=Math.max(1,...sources.values());return `<div class="page-stack"><section class="report-intro"><div><span class="eyebrow">CLEAR NUMBERS, BETTER NEXT STEPS</span><h2>Your travel business, <em>in view.</em></h2><p>Financial performance and fare analysis for the selected records.</p></div><div class="report-export"><div class="report-export-copy"><strong>Filtered report records</strong><span>Downloads follow the active period, dates and record type.</span></div><div class="table-actions"><button class="button small soft" data-action="export-excel" data-scope="report">${icon('excel')}Filtered · Excel</button><button class="button small primary" data-action="export-pdf" data-scope="report">${icon('file')}Filtered · PDF</button></div></div></section><section class="surface panel"><div class="report-controls"><label class="field"><span>Record type</span><select class="control" data-change="report-type"><option value="all" ${state.reportType==='all'?'selected':''}>Enquiries + bookings</option><option value="enquiry" ${state.reportType==='enquiry'?'selected':''}>Enquiries only</option><option value="booking" ${state.reportType==='booking'?'selected':''}>Bookings only</option></select></label><label class="field"><span>Entry date from</span><input class="control" type="date" value="${h(state.reportFrom)}" data-change="report-from"></label><label class="field"><span>Entry date to</span><input class="control" type="date" value="${h(state.reportTo)}" data-change="report-to"></label><button class="button soft" data-action="reset-report">Reset report filters</button></div><p class="muted" style="font-size:12px;margin:12px 0 0">Custom dates filter when each enquiry or booking was entered. The global period is also applied. ${rows.length} records match.</p></section><section class="report-grid"><article class="report-card"><span>Quoted bookings</span><strong>${money(total)}</strong></article><article class="report-card"><span>Payments received</span><strong>${money(received)}</strong></article><article class="report-card"><span>Outstanding</span><strong>${money(due)}</strong></article><article class="report-card"><span>Net profit</span><strong>${money(profit)}</strong></article></section><section class="report-charts"><article class="surface panel"><div class="section-head"><div><h3>Issuing source</h3><p>Quoted booking value by source.</p></div></div>${sources.size?[...sources.entries()].sort((a,b)=>b[1]-a[1]).map(([label,value])=>`<div class="source-bar"><span>${h(label)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${Math.max(4,value/max*100)}%"></span></span><strong style="font-size:11px;text-align:right">${money(value)}</strong></div>`).join(''):'<div class="empty-state">Add booking issuing sources to see the analysis.</div>'}</article><article class="surface panel"><div class="section-head"><div><h3>Payment status</h3><p>Bookings in the filtered period.</p></div></div>${['paid','partially_paid','pending'].map(k=>{const count=bookings.filter(r=>(r.paymentStatus||'pending')===k).length;return `<div class="toggle-row"><span><strong>${paymentLabel(k)}</strong><small>${count} booking${count===1?'':'s'}</small></span><span class="payment-pill payment-${k}">${bookings.length?Math.round(count/bookings.length*100):0}%</span></div>`}).join('')}</article></section><section class="surface panel"><div class="section-head"><div><span class="eyebrow">FILTERED RECORDS</span><h3 style="margin-top:4px">Enquiries and bookings</h3></div></div><div class="report-table-wrap">${renderTable(rows,{grouped:false,actions:false})}</div></section></div>`;}
    function renderSettings(){const admin=state.profile?.role==='admin';const s=state.settings;return `<div class="page-stack"><section class="settings-intro"><span class="eyebrow">MAKE THE DESK YOURS</span><h2>Settings &amp; team access</h2><p class="muted">${admin?'Manage the shared portal setup and approve new employee accounts.':'View the team setup. Only an approved administrator can change shared settings or approve staff.'}</p></section><div class="settings-grid"><section class="surface settings-panel"><h3>Portal identity</h3><div class="form-grid"><label class="field full"><span>Agency name</span><input name="agencyName" value="${h(s.agencyName)}" ${admin?'':'disabled'}></label><label class="field full"><span>Logo image URL (HTTPS)</span><input name="logoUrl" value="${h(s.logoUrl)}" ${admin?'':'disabled'} placeholder="https://…"></label><label class="field"><span>Report currency</span><select name="currency" ${admin?'':'disabled'}>${['GBP','EUR','USD'].map(c=>`<option value="${c}" ${s.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field"><span>Signature color</span><input type="color" name="accentColor" value="${h(safeColor(s.accentColor))}" ${admin?'':'disabled'}></label></div><p class="muted" style="font-size:12px">Changing currency does not convert existing amounts. Confirm the team's currency before entering records.</p><h3 style="margin-top:19px">Workspace sections</h3>${Object.entries({dashboard:'Dashboard',enquiries:'Enquiries',bookings:'Bookings',reports:'Reports'}).map(([key,label])=>`<div class="toggle-row"><span><strong>${label}</strong><small>Show or hide this section in navigation</small></span><button type="button" class="switch ${s.modules?.[key]?'on':''}" data-action="toggle-module" data-module="${key}" aria-label="Toggle ${label}" ${admin?'':'disabled'}></button></div>`).join('')}<button class="button primary settings-save" data-action="save-settings" ${admin?'':'disabled'}>Save shared settings</button></section><section class="surface settings-panel"><h3>Custom record fields</h3><p class="muted" style="font-size:12px">Add a field to both enquiry and booking forms.</p><div id="customFields">${(s.customFields||[]).map(f=>`<div class="custom-field-row"><span><strong>${h(f.label)}</strong><small> · ${h(f.type)}</small></span><button class="icon-button" data-action="remove-field" data-id="${h(f.id)}" ${admin?'':'disabled'} aria-label="Remove field">${icon('trash')}</button></div>`).join('')||'<p class="muted" style="font-size:13px">No custom fields configured.</p>'}</div>${admin?`<form id="addFieldForm" class="form-grid" style="margin-top:12px"><label class="field"><span>Field label</span><input name="label" required maxlength="38" placeholder="e.g. Loyalty number"></label><label class="field"><span>Field type</span><select name="type"><option value="text">Text</option><option value="number">Number</option><option value="date">Date</option></select></label><button class="button soft field full" type="submit">${icon('plus')}Add custom field</button></form>`:''}</section></div>${admin?`<section class="surface settings-panel"><div class="section-head"><div><h3>Employee access requests</h3><p>New registrations remain pending until you approve them here.</p></div><span class="status-pill">${state.pendingUsers.length} pending</span></div>${state.pendingUsers.length?state.pendingUsers.map(u=>`<div class="employee-row"><div><strong>${h(u.displayName||'New employee')}</strong><small>${h(u.email||'')} · ${h(u.phone||'No phone added')}</small></div><button class="button small primary" data-action="approve-user" data-id="${h(u.uid)}">${icon('check')}Approve</button></div>`).join(''):'<p class="muted" style="font-size:13px">No employee accounts are waiting for approval.</p>'}</section>`:''}<section class="notice"><strong>Security note</strong><br>Shared data is available only to active employees and administrators. The temporary signup OTP is only a testing code; it is not sent or identity-verified. For a live workforce, configure email verification or a server-verified SMS flow.</section></div>`;}
    function defaultRecord(type='enquiry'){const today=localKey(new Date());return {recordType:type,status:type==='enquiry'?'new':'confirmed',customerName:'',passengers:'',email:'',contactNo:'',enquiryDate:type==='enquiry'?today:'',bookingDate:type==='booking'?today:'',departureDate:'',origin:'',destination:'',systemPnr:'',airlinePnr:'',ticketNumber:'',sourceEnquiryId:'',adultCount:1,youthCount:0,childCount:0,infantCount:0,netFareAdult:0,netFareYouth:0,netFareChild:0,netFareInfant:0,totalNet:0,clientFareAdult:0,clientFareYouth:0,clientFareChild:0,clientFareInfant:0,totalFareQuoted:0,profit:0,receivedPayment:0,paymentStatus:'pending',paymentDate:'',paymentMode:'',issuedFrom:'',remarks:'',customFields:{}};}
    function renderModal(){const editing=!!state.editId;const type=state.formType;const d=state.formData||defaultRecord(type);const isBooking=type==='booking';const eligible=state.records.enquiries.filter(r=>!r.linkedBookingId&&!['converted','lost'].includes(r.status));const selected=state.records.enquiries.find(r=>r.id===d.sourceEnquiryId);const groups=GROUPS.filter(g=>state.expanded.has(g.key));return `<div class="modal-backdrop" data-action="backdrop-close"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><div><h2 id="modalTitle">${editing?'Edit':isBooking?'Add a booking':'Add an enquiry'}</h2><p>${isBooking?'Capture passenger, fare, payment and ticket details.':'Record the request and the next follow-up.'}</p></div><button class="icon-button" data-action="close-modal" aria-label="Close">${icon('close')}</button></header><form id="recordForm" class="modal-body"><input type="hidden" name="recordType" value="${isBooking?'booking':'enquiry'}"><input type="hidden" name="sourceEnquiryId" value="${h(d.sourceEnquiryId||'')}">${isBooking&&!editing?`<fieldset class="form-section"><legend>Start from an existing enquiry</legend><label class="field"><span>Select enquiry (optional)</span><select class="control" name="sourceEnquiryPicker" data-change="source-enquiry"><option value="">Create a new booking</option>${eligible.map(e=>`<option value="${h(e.id)}" ${d.sourceEnquiryId===e.id?'selected':''}>${h(e.customerName||'Unnamed')} · ${h(e.destination||'Journey TBD')} · ${h(formatDate(e.enquiryDate||e.createdAt))}</option>`).join('')}</select></label>${selected?`<p class="notice" style="margin:9px 0 0">Booking from enquiry: <strong>${h(selected.customerName)}</strong>. This enquiry can be linked to only one booking.</p>`:''}${!eligible.length?'<p class="muted" style="font-size:12px;margin:8px 0 0">No unbooked enquiries are available.</p>':''}</fieldset>`:''}<fieldset class="form-section"><legend>Customer &amp; jo     function captureRecordForm(form){const fd=new FormData(form);const d={};for(const [k,v] of fd.entries()){if(k==='sourceEnquiryPicker')continue;if(k.startsWith('custom_'))continue;d[k]=v;}for(const k of NUMERIC)d[k]=Math.max(0,Number(d[k])||0);d.customFields={...(state.formData?.customFields||{})};for(const f of state.settings.customFields||[])d.customFields[f.id]=String(fd.get('custom_'+f.id)||'');return d;}

    async function handleAuthSubmit(form){state.authError='';const d=Object.fromEntries(new FormData(form).entries());try{if(state.authMode==='login'){await auth.signInWithEmailAndPassword(String(d.email).trim(),String(d.password));return;}if(String(d.password)!==String(d.confirmPassword))throw new Error('Passwords do not match.');if(String(d.password).length<8)throw new Error('Choose a password with at least 8 characters.');if(!state.otp||Date.now()>state.otp.expiresAt)throw new Error('The temporary test code expired. Generate a new code.');if(String(d.otp)!==state.otp.code)throw new Error('The temporary test code does not match.');const cred=await auth.createUserWithEmailAndPassword(String(d.email).trim(),String(d.password));await cred.user.updateProfile({displayName:String(d.displayName).trim()});const ref=db.collection('users').doc(cred.user.uid);await ref.set({uid:cred.user.uid,displayName:String(d.displayName).trim(),email:cred.user.email||'',phone:String(d.phone||''),role:'pending',status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});state.screen='pending';state.profile={role:'pending',status:'pending',displayName:String(d.displayName).trim()};render();}catch(e){state.authError=friendlyError(e);render();}}
    async function saveRecord(form){const raw=captureRecordForm(form);const type=raw.recordType==='booking'?'booking':'enquiry';const data={...defaultRecord(type),...raw,recordType:type,customerName:String(raw.customerName||'').trim(),sourceEnquiryId:raw.sourceEnquiryId||null,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:state.user.uid,customFields:raw.customFields||{}};delete data.id;delete data.sourceEnquiryPicker;if(type==='enquiry'){data.enquiryDate=raw.enquiryDate||'';data.bookingDate='';delete data.sourceEnquiryId;}else{data.enquiryDate=raw.enquiryDate||'';data.bookingDate=raw.bookingDate||'';data.createdBy=state.user.uid;}if(state.editId){const ref=db.collection(type==='enquiry'?'inquiries':'bookings').doc(state.editId);await ref.update(data);return;}data.createdBy=state.user.uid;data.createdAt=firebase.firestore.FieldValue.serverTimestamp();if(type==='enquiry'){await db.collection('inquiries').add(data);return;}const sourceId=data.sourceEnquiryId;if(!sourceId){await db.collection('bookings').add(data);return;}const inquiryRef=db.collection('inquiries').doc(sourceId);const bookingId=`linked_${sourceId}`;const bookingRef=db.collection('bookings').doc(bookingId);await db.runTransaction(async tx=>{const [source,existing]=await Promise.all([tx.get(inquiryRef),tx.get(bookingRef)]);if(!source.exists)throw new Error('The selected enquiry no longer exists.');if(existing.exists||source.data().linkedBookingId||source.data().status==='converted')throw new Error('This enquiry has already been booked.');if(['lost','converted'].includes(source.data().status))throw new Error('This enquiry is no longer eligible for booking.');tx.update(inquiryRef,{status:'converted',linkedBookingId:bookingId,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});tx.set(bookingRef,{...data,sourceEnquiryId:sourceId});});}

      const currencyFmt=({GBP:'£',EUR:'€',USD:'$'})[state.settings.currency]||'£';for(const key of ['totalNet','totalFareQuoted','receivedPayment','profit']){const c=cols.findIndex(x=>x[1]===key)+1;if(c>0)for(let r=startRow+1;r<=lastRow;r++)ws.getCell(r,c).numFmt=`"${currencyFmt}"#,##0.00;[Red]-"${currencyFmt}"#,##0.00`;}
      for(const key of ['enquiryDate','bookingDate','departureDate','followUpDate']){const c=cols.findIndex(x=>x[1]===key)+1;if(c>0)for(let r=startRow+1;r<=lastRow;r++)ws.getCell(r,c).numFmt='dd mmm yyyy';}
      const fare=wb.addWorksheet('Passenger Fares',{views:[{state:'frozen',ySplit:1}]});const fareCols=['Sr. No.','Booking reference','Customer','Passenger type','Quantity','Net each','Quoted each','Net total','Quoted total'];const fareRows=[];let sr=0;rows.filter(r=>r.recordType==='booking').forEach(r=>GROUPS.forEach(g=>{const q=Number(r[g.count])||0;if(q||Number(r[g.net])||Number(r[g.quote]))fareRows.push([++sr,r.systemPnr||r.id,r.customerName||'',g.label,q,Number(r[g.net])||0,Number(r[g.quote])||0,(Number(r[g.net])||0)*q,(Number(r[g.quote])||0)*q]);}));fare.addTable({name:'PassengerFareTable',ref:'A1',headerRow:true,style:{theme:'TableStyleMedium4',showRowStripes:true},columns:fareCols.map(name=>({name})),rows:fareRows});fare.columns=[12,22,28,18,12,16,16,17,17].map(width=>({width}));fare.eachRow({includeEmpty:true},row=>row.eachCell({includeEmpty:true},cell=>{cell.border={top:{style:'thin',color:{argb:'FFD7E3F0'}},left:{style:'thin',color:{argb:'FFD7E3F0'}},bottom:{style:'thin',color:{argb:'FFD7E3F0'}},right:{style:'thin',color:{argb:'FFD7E3F0'}}};cell.alignment={vertical:'middle',wrapText:true};}));
      const summary=wb.addWorksheet('Report Summary');summary.mergeCells('A1:D1');summary.getCell('A1').value='AJ TOURS & TRAVEL · REPORT SUMMARY';summary.getCell('A1').font={bold:true,size:16,color:{argb:'FFFFFFFF'}};summary.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1677E8'}};summary.addTable({name:'ReportSummary',ref:'A3',headerRow:true,style:{theme:'TableStyleMedium2',showRowStripes:true},columns:['Metric','Value','Metric','Value'].map(name=>({name})),rows:[['Records exported',rows.length,'Period',periodLabel()],['Enquiries',rows.filter(r=>r.recordType==='enquiry').length,'Bookings',rows.filter(r=>r.recordType==='booking').length],['Quoted bookings',sum(rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled'),'totalFareQuoted'),'Payments received',sum(rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled'),'receivedPayment')],['Outstanding',Math.max(0,sum(rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled'),'totalFareQuoted')-sum(rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled'),'receivedPayment')),'Profit',sum(rows.filter(r=>r.recordType==='booking'&&r.status!=='cancelled'),'profit')]]});summary.columns=[27,24,27,24].map(width=>({width}));summary.eachRow({includeEmpty:true},row=>row.eachCell({includeEmpty:true},cell=>{cell.border={top:{style:'thin',color:{argb:'FFD7E3F0'}},left:{style:'thin',color:{argb:'FFD7E3F0'}},bottom:{style:'thin',color:{argb:'FFD7E3F0'}},right:{style:'thin',color:{argb:'FFD7E3F0'}}};cell.alignment={vertical:'middle',wrapText:true};}));
      const blob=await wb.xlsx.writeBuffer();downloadBlob(new Blob([blob],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`${exportLabel(rows)}.xlsx`);showToast('Formatted Excel workbook downloaded.');}
    function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
    function reportTitle(){const f=state.reportFrom?` · from ${state.reportFrom}`:'';const t=state.reportTo?` · to ${state.reportTo}`:'';return `${periodLabel()}${f}${t}`;}
    function pdfHeader(doc,sub=''){doc.setFillColor(22,119,232);doc.rect(0,0,297,27,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('AJ TOURS & TRAVEL',10,12);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(sub||reportTitle(),10,20);doc.setTextColor(27,44,64);}
    function pdfFooter(doc){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(221,230,239);doc.line(10,199,287,199);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(119,135,154);doc.text('Confidential · AJ Tours & Travel',10,205);doc.text(`Page ${i} of ${n}`,287,205,{align:'right'});}}
    function detailFields(r,sr){const items=[['Sr. No.',sr],['Record type',r.recordType==='enquiry'?'Enquiry':'Booking'],['Customer / passenger',r.customerName],['Passenger details',r.passengers],['Contact',r.contactNo],['Email',r.email],['Origin',r.origin],['Destination',r.destination],['Entry date',formatDate(r.createdAt)],['Enquiry date',formatDate(r.enquiryDate)],['Booking date',formatDate(r.bookingDate)],['Departure date',formatDate(r.departureDate)],['System PNR',r.systemPnr],['Airline PNR',r.airlinePnr],['Ticket number',r.ticketNumber],['Status',statusLabel(r.status)],['Passengers · Adult',r.adultCount],['Passengers · Youth',r.youthCount],['Passengers · Child',r.childCount],['Passengers · Infant',r.infantCount],['Net fare · Adult',money(r.netFareAdult)],['Net fare · Youth',money(r.netFareYouth)],['Net fare · Child',money(r.netFareChild)],['Net fare · Infant',money(r.netFareInfant)],['Total net',money(r.totalNet)],['Quoted fare · Adult',money(r.clientFareAdult)],['Quoted fare · Youth',money(r.clientFareYouth)],['Quoted fare · Child',money(r.clientFareChild)],['Quoted fare · Infant',money(r.clientFareInfant)],['Total quoted',money(r.totalFareQuoted)],['Profit',money(r.profit)],['Received payment',money(r.receivedPayment)],['Payment status',paymentLabel(r.paymentStatus)],['Payment method',r.paymentMode],['Payment date',formatDate(r.paymentDate)],['Issuing source',r.issuedFrom],['Follow-up date',formatDate(r.followUpDate)],['Remarks',r.remarks]];for(const f of state.settings.customFields||[])if((r.customFields||{})[f.id])items.push([f.label,(r.customFields||{})[f.id]]);return items.filter(([,v])=>v!==undefined&&v!==null&&v!=='');}
    async function exportPdf(scope){const rows=exportRows(scope);if(!rows.length)throw new Error('There are no matching records to export.');await loadScript('https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js','jspdf');await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.9/dist/jspdf.plugin.autotable.min.js');const C=window.jspdf?.jsPDF;if(!C)throw new Error('PDF library did not initialize.');const doc=new C({orientation:'landscape',unit:'mm',format:'a4'});if(typeof doc.autoTable!=='function'&&window.jspdfAutoTable)window.jspdfAutoTable.default?.(doc,{});if(typeof doc.autoTable!=='function')throw new Error('PDF table layout could not initialize. Reload the page and try again.');pdfHeader(doc,`${reportTitle()} · ${rows.length} records`);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Filtered record summary',10,35);doc.setFont('helvetica','normal');doc.setFontSize(8);const overview=rows.map((r,i)=>[i+1,r.recordType==='enquiry'?'Enquiry':'Booking',r.customerName||'—',[r.origin,r.destination].filter(Boolean).join(' → ')||'—',formatDate(r.createdAt,{day:'2-digit',month:'short',year:'2-digit'}),formatDate(r.departureDate,{day:'2-digit',month:'short',year:'2-digit'}),statusLabel(r.status),`${r.adultCount||0}A ${r.youthCount||0}Y ${r.childCount||0}C ${r.infantCount||0}I`,money(r.totalFareQuoted),money(r.receivedPayment),paymentLabel(r.paymentStatus),money(r.profit)]);doc.autoTable({head:[['Sr. No.','Type','Customer','Journey','Entry date','Departure','Status','Pax','Total quoted','Received','Payment','Profit']],body:overview,startY:40,theme:'grid',styles:{font:'helvetica',fontSize:8.3,cellPadding:2.1,overflow:'linebreak',valign:'middle',textColor:[35,54,77],lineColor:[205,218,232],lineWidth:.18},headStyles:{fillColor:[22,119,232],textColor:[255,255,255],fontStyle:'bold',fontSize:8},alternateRowStyles:{fillColor:[244,249,255]},margin:{left:10,right:10,top:34,bottom:14},didDrawPage:data=>{if(data.pageNumber>1)pdfHeader(doc,`${reportTitle()} · ${rows.length} records`);}});
      rows.forEach((r,i)=>{doc.addPage();pdfHeader(doc,`Record ${i+1} of ${rows.length} · ${r.recordType==='enquiry'?'Enquiry':'Booking'}`);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(`${i+1}. ${String(r.customerName||'Travel record').slice(0,90)}`,10,35);const f=detailFields(r,i+1);const paired=[];for(let j=0;j<f.length;j+=2)paired.push([String(f[j][0]),String(f[j][1]),f[j+1]?String(f[j+1][0]):'',f[j+1]?String(f[j+1][1]):'']);doc.autoTable({head:[['FIELD','DETAIL','FIELD','DETAIL']],body:paired,startY:40,theme:'grid',styles:{font:'helvetica',fontSize:9.1,cellPadding:2.6,overflow:'linebreak',valign:'middle',textColor:[35,54,77],lineColor:[205,218,232],lineWidth:.2},headStyles:{fillColor:[22,119,232],textColor:[255,255,255],fontStyle:'bold',fontSize:8.8},alternateRowStyles:{fillColor:[244,249,255]},columnStyles:{0:{cellWidth:28,fontStyle:'bold',textColor:[66,91,120]},1:{cellWidth:110},2:{cellWidth:28,fontStyle:'bold',textColor:[66,91,120]},3:{cellWidth:111}},margin:{left:10,right:10,top:35,bottom:14},rowPageBreak:'avoid',didDrawPage:data=>{if(data.pageNumber>1)pdfHeader(doc,`Record ${i+1} · continued`);}});});pdfFooter(doc);doc.save(`${exportLabel(rows)}.pdf`);showToast('Formatted PDF report downloaded.');}

    function updateRecordResults(){if(!['enquiries','bookings'].includes(state.view))return;const rows=activeRecords(state.view);const count=document.querySelector('.record-count strong');if(count)count.textContent=String(rows.length);const label=document.querySelector('.record-count span');if(label)label.textContent=`${state.view} · ${periodLabel().toLowerCase()}`;const table=document.querySelector('.table-scroll');if(table)table.innerHTML=renderTable(rows,{grouped:true,actions:true});const clear=document.querySelector('[data-action="clear-search"]');if(clear)clear.classList.toggle('hidden',!state.search);}
    function updateDraftTotals(d){const net=GROUPS.reduce((n,g)=>n+(Number(d[g.net])||0)*(Number(d[g.count])||0),0);const quote=GROUPS.reduce((n,g)=>n+(Number(d[g.quote])||0)*(Number(d[g.count])||0),0);if(!state.manualNet)d.totalNet=round2(net);if(!state.manualQuote)d.totalFareQuoted=round2(quote);d.profit=round2((Number(d.totalFareQuoted)||0)-(Number(d.totalNet)||0));return d;}
    function isFareInput(name){return NUMERIC.includes(name);}
    function handleInput(e){const el=e.target;if(el.matches('[data-input="search"]')){state.search=el.value;updateRecordResults();return;}if(el.closest('#recordForm')){const form=el.closest('#recordForm');const key=el.name||'';state.formData=captureRecordForm(form);if(isFareInput(key)){updateCalculated(form,key);}else state.formData=captureRecordForm(form);}}
    async function handleChange(e){const el=e.target;const kind=el.dataset.change;if(!kind)return;if(kind==='period'){state.period=el.value;render();return;}if(kind==='status'){state.status=el.value;updateRecordResults();return;}if(kind==='sort'){state.sort=el.value;updateRecordResults();return;}if(kind==='report-type'){state.reportType=el.value;render();return;}if(kind==='report-from'){state.reportFrom=el.value;render();return;}if(kind==='report-to'){state.reportTo=el.value;render();return;}if(kind==='source-enquiry'){const form=document.getElementById('recordForm');const d=captureRecordForm(form);const src=state.records.enquiries.find(r=>r.id===el.value);if(src){state.formData={...d,...src,recordType:'booking',status:'confirmed',bookingDate:d.bookingDate||localKey(new Date()),enquiryDate:src.enquiryDate||d.enquiryDate,sourceEnquiryId:src.id,paymentStatus:'pending',paymentMode:'',receivedPayment:0,createdAt:undefined,updatedAt:undefined,id:undefined};}else{state.formData={...d,sourceEnquiryId:''};}state.expanded=new Set(['adult',...GROUPS.filter(g=>g.key!=='adult'&&(Number(state.formData[g.count])>0||Number(state.formData[g.net])>0||Number(state.formData[g.quote])>0)).map(g=>g.key)]);state.manualNet=false;state.manualQuote=false;state.formData=updateDraftTotals(state.formData);render();}}
    async function handleSubmit(e){const form=e.target;if(!(form instanceof HTMLFormElement))return;if(form.id==='authForm'){e.preventDefault();await handleAuthSubmit(form);return;}if(form.id==='recordForm'){e.preventDefault();if(!navigator.onLine){showToast('Reconnect to the internet before saving records.',true);return;}const submit=form.querySelector('[type="submit"]');if(submit)submit.disabled=true;try{await saveRecord(form);showToast(state.editId?'Record updated.':state.formType==='booking'?'Booking created.':'Enquiry saved.');state.formData=null;state.editId=null;render();}catch(err){showToast(friendlyError(err),true);if(submit)submit.disabled=false;}return;}if(form.id==='addFieldForm'){e.preventDefault();try{await addCustomField(form);render();}catch(err){showToast(friendlyError(err),true);}}}
    async function handleClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;try{
      if(a==='nav'){changeView(btn.dataset.view);return;}
      if(a==='toggle-mobile'){state.mobileOpen=true;render();return;}
      if(a==='close-mobile'){state.mobileOpen=false;render();return;}
      if(a==='close-modal'||(a==='backdrop-close'&&e.target===btn)){closeModal();return;}
      if(a==='new-record'){openNew(btn.dataset.type==='booking'?'booking':'enquiry');return;}
      if(a==='auth-mode'){state.authMode=btn.dataset.mode==='signup'?'signup':'login';state.authError='';if(state.authMode==='signup'&&!state.otp)issueOtp();render();return;}
      if(a==='regenerate-otp'){issueOtp();state.authError='';render();return;}
      if(a==='logout'){stopListeners();await auth.signOut();state.profile=null;state.screen='auth';state.authMode='login';state.authError='';render();return;}
      if(a==='forgot-password'){const email=document.querySelector('#authForm [name="email"]')?.value?.trim();if(!email){state.authError='Enter your email address above first.';render();return;}await auth.sendPasswordResetEmail(email);state.authError='If this email has an account, Firebase has sent a password-reset link.';render();return;}
      if(a==='clear-search'){state.search='';const input=document.querySelector('[data-input="search"]');if(input)input.value='';updateRecordResults();return;}
      if(a==='reset-report'){state.reportType='all';state.reportFrom='';state.reportTo='';render();return;}
      if(a==='edit-record'){openEdit(btn.dataset.type==='booking'?'booking':'enquiry',btn.dataset.id);return;}
      if(a==='convert'){openNew('booking',btn.dataset.id);return;}
      if(a==='delete-record'){await deleteRecord(btn.dataset.type==='booking'?'booking':'enquiry',btn.dataset.id);return;}
      if(a==='close-modal'){closeModal();return;}
      if(a==='add-fare'){const form=document.getElementById('recordForm');if(form)state.formData=captureRecordForm(form);state.expanded.add(btn.dataset.group);render();return;}
      if(a==='quantity'){const form=document.getElementById('recordForm');if(form)state.formData=captureRecordForm(form);const key=btn.dataset.field;state.formData[key]=Math.max(0,(Number(state.formData[key])||0)+Number(btn.dataset.step||0));state.formData=updateDraftTotals(state.formData);render();return;}
      if(a==='recalculate'){state.manualNet=false;state.manualQuote=false;const form=document.getElementById('recordForm');if(form){state.formData=captureRecordForm(form);state.formData=updateDraftTotals(state.formData);render();}return;}
      if(a==='toggle-module'){btn.classList.toggle('on');btn.setAttribute('aria-pressed',String(btn.classList.contains('on')));return;}
      if(a==='save-settings'){await saveSettings();return;}
      if(a==='remove-field'){if(state.profile?.role!=='admin')return;const fields=(state.settings.customFields||[]).filter(f=>f.id!==btn.dataset.id);await saveCurrentSettings({customFields:fields});showToast('Custom field removed.');return;}
      if(a==='approve-user'){await approveUser(btn.dataset.id);return;}
      if(a==='export-excel'){btn.disabled=true;await exportExcel(btn.dataset.scope);btn.disabled=false;return;}
      if(a==='export-pdf'){btn.disabled=true;await exportPdf(btn.dataset.scope);btn.disabled=false;return;}
    }catch(err){showToast(friendlyError(err),true);const enabled=btn.closest('.table-actions')?.querySelectorAll('button[disabled]');if(enabled)enabled.forEach(b=>b.disabled=false);}}
    appRoot.addEventListener('click',e=>{handleClick(e);});
    appRoot.addEventListener('input',handleInput);
    appRoot.addEventListener('change',e=>{handleChange(e);});
    appRoot.addEventListener('submit',e=>{handleSubmit(e);});
    window.addEventListener('online',()=>render());
    window.addEventListener('offline',()=>render());
    if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
    if(!appConfigAvailable){render();return;}
    try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});auth.onAuthStateChanged(user=>{state.user=user;if(!user){stopListeners();state.profile=null;state.screen='auth';state.syncError='';render();return;}activateSession(user);});}catch(err){state.screen='auth';state.authError=friendlyError(err);render();}
  })();
  </script>
